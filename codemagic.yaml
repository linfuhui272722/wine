workflows:
  ios-build:
    name: Wine iOS Build (Mac Mini M2)
    max_build_duration: 120
    
    environment:
      vars:
        MIN_IOS_VERSION: "13.0"
        APP_BUNDLE_ID: "com.wine.ios.app"
      flutter: stable
      
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    
    scripts:
      # Step 1: Verify Xcode
      - name: Verify Xcode
        script: |
          echo "=== Xcode Version ==="
          xcodebuild -version
          xcode-select --print-path
      
      # Step 2: Navigate and setup
      - name: Setup build directory
        script: |
          echo "=== Setup ==="
          PROJECT_DIR="/Users/builder/clone/dlls/wineios.drv/ios-app"
          cd "$PROJECT_DIR"
          pwd
          ls -la
      
      # Step 3: Clean
      - name: Clean build
        script: |
          echo "=== Clean ==="
          PROJECT_DIR="/Users/builder/clone/dlls/wineios.drv/ios-app"
          cd "$PROJECT_DIR"
          rm -rf build
          rm -rf ~/Library/Developer/Xcode/DerivedData/Wine-*
      
      # Step 4: Build - key step that creates the .app
      - name: Build iOS Project
        script: |
          echo "=== Building ==="
          
          # Get the full path to the project
          PROJECT_DIR="/Users/builder/clone/dlls/wineios.drv/ios-app"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR/"
          
          # Build - this creates the actual .app bundle with executable
          cd "$PROJECT_DIR"
          xcodebuild -project "$PROJECT_DIR/project.pbxproj" \
            -scheme Wine \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=$MIN_IOS_VERSION \
            BUILD_LIBRARY_FOR_DISTRIBUTING=NO \
            2>&1 | tee build.log
          
          # Check if build succeeded
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "=== BUILD FAILED ==="
            grep -i "error:" build.log || tail -50 build.log
            exit 1
          fi
          
          echo "=== Build Succeeded ==="
      
      # Step 5: Find the built app
      - name: Find built app
        script: |
          echo "=== Finding App ==="
          
          PROJECT_DIR="/Users/builder/clone/dlls/wineios.drv/ios-app"
          
          # Search in DerivedData
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "Wine.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Wine.app not found!"
            exit 1
          fi
          
          echo "Found app at: $APP_DIR"
          ls -la "$APP_DIR/"
          
          # Check for executable
          if [ ! -f "$APP_DIR/Wine" ]; then
            echo "ERROR: Wine executable not found in app bundle!"
            ls -la "$APP_DIR/"
            exit 1
          fi
          
          echo "Executable found!"
          ls -la "$APP_DIR/Wine"
      
      # Step 6: Copy app to Payload
      - name: Prepare IPA
        script: |
          echo "=== Preparing IPA ==="
          
          PROJECT_DIR="/Users/builder/clone/dlls/wineios.drv/ios-app"
          cd "$PROJECT_DIR"
          
          mkdir -p build/Payload
          rm -rf build/Payload/Wine.app
          
          # Copy the built app
          cp -R $(find ~/Library/Developer/Xcode/DerivedData -name "Wine.app" -type d 2>/dev/null | head -1) build/Payload/
          
          echo "=== Payload Contents ==="
          ls -la build/Payload/Wine.app/
          ls -la build/Payload/Wine.app/Wine 2>/dev/null || echo "Checking executable..."
      
      # Step 7: Create IPA
      - name: Create IPA package
        script: |
          echo "=== Creating IPA ==="
          
          PROJECT_DIR="/Users/builder/clone/dlls/wineios.drv/ios-app"
          cd "$PROJECT_DIR/build"
          
          rm -f Wine.ipa
          
          # Create IPA from Payload
          zip -r Wine.ipa Payload/
          
          echo "=== IPA Created ==="
          ls -la Wine.ipa
          
          # Verify IPA has executable
          unzip -l Wine.ipa | grep -E "Wine$|\.app/" | head -10

    artifacts:
      - dlls/wineios.drv/ios-app/build/Wine.ipa
      - dlls/wineios.drv/ios-app/build/build.log

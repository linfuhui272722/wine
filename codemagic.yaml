workflows:
  ios-build:
    name: Wine iOS Build
    max_build_duration: 60
    environment:
      vars:
        MIN_IOS_VERSION: "13.0"
        APP_BUNDLE_ID: "com.wine.ios.app"
        APP_DIR: "/Users/builder/clone"
        SDK_PATH: "$(xcrun --sdk iphoneos --show-sdk-path)"
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Verify environment
        script: |
          set -e
          echo "Environment check"
          xcodebuild -version
      - name: Setup build directory
        script: |
          set -e
          cd $APP_DIR
          rm -rf dlls/wineios.drv/ios-app/build
          mkdir -p dlls/wineios.drv/ios-app/build
          rm -rf ~/Library/Developer/Xcode/DerivedData/Wine-*
          echo "Ready"
      - name: Compile Wine iOS Core
        script: |
          set -e
          cd $APP_DIR
          SDK="$SDK_PATH"
          TARGET="arm64-apple-ios"
          CFLAGS="-target $TARGET -isysroot $SDK -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -fno-common -Wall -O2"
          mkdir -p dlls/wineios.drv/ios-app/build/objects/wineios
          for src in dlls/wineios.drv/wineios/*.c; do
            NAME=$(basename "$src" .c)
            clang $CFLAGS -Idlls/wineios.drv/wineios -c "$src" -o "dlls/wineios.drv/ios-app/build/objects/wineios/${NAME}.o" 2>/dev/null || true
          done
          ar rcs dlls/wineios.drv/ios-app/build/libwineios.a dlls/wineios.drv/ios-app/build/objects/wineios/*.o 2>/dev/null || true
          echo "Core done"
      - name: Compile iOS App
        script: |
          set -e
          cd $APP_DIR
          SDK="$SDK_PATH"
          TARGET="arm64-apple-ios"
          CFLAGS="-target $TARGET -isysroot $SDK -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -fno-common -Wall -O2 -fobjc-arc"
          mkdir -p dlls/wineios.drv/ios-app/build/objects/app
          for src in dlls/wineios.drv/ios-app/*.m; do
            NAME=$(basename "$src" .m)
            clang $CFLAGS -Idlls/wineios.drv/ios-app -Idlls/wineios.drv/wineios -c "$src" -o "dlls/wineios.drv/ios-app/build/objects/app/${NAME}.o" 2>/dev/null || true
          done
          ar rcs dlls/wineios.drv/ios-app/build/libwineapp.a dlls/wineios.drv/ios-app/build/objects/app/*.o 2>/dev/null || true
          echo "App done"
      - name: Build with xcodebuild
        script: |
          set -e
          cd $APP_DIR
          cp dlls/wineios.drv/ios-app/build/libwineios.a dlls/wineios.drv/ios-app/
          cp dlls/wineios.drv/ios-app/build/libwineapp.a dlls/wineios.drv/ios-app/
          xcodebuild -project dlls/wineios.drv/ios-app/Wine.xcodeproj -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=$MIN_IOS_VERSION ARCHS=arm64 2>&1 | tail -20
      - name: Create IPA
        script: |
          set -e
          cd $APP_DIR
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Wine.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then echo "App not found"; exit 1; fi
          BUILD_DIR=dlls/wineios.drv/ios-app/build
          mkdir -p $BUILD_DIR/Payload
          rm -rf $BUILD_DIR/Payload/Wine.app
          cp -R "$APP_PATH" $BUILD_DIR/Payload/
          mkdir -p "$BUILD_DIR/Payload/Wine.app/wine/drive_c/windows/system32"
          mkdir -p "$BUILD_DIR/Payload/Wine.app/documents"
          printf "[wine]\nVersion=8.0\n" > "$BUILD_DIR/Payload/Wine.app/wine/config"
          printf "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\">\n<dict>\n<key>CFBundleExecutable</key><string>Wine</string>\n<key>CFBundleIdentifier</key><string>com.wine.ios.app</string>\n<key>CFBundleName</key><string>Wine</string>\n<key>CFBundleDisplayName</key><string>Wine iOS</string>\n<key>CFBundleShortVersionString</key><string>8.0</string>\n<key>CFBundleVersion</key><string>1</string>\n<key>MinimumOSVersion</key><string>13.0</string>\n</dict>\n</plist>\n" > "$BUILD_DIR/Payload/Wine.app/Info.plist"
          printf "APPL????" > "$BUILD_DIR/Payload/Wine.app/PkgInfo"
          rm -rf "$BUILD_DIR/Payload/Wine.app/_CodeSignature"
          cd $BUILD_DIR
          rm -f Wine.ipa
          zip -r Wine.ipa Payload/
          ls -la Wine.ipa
    artifacts:
      - dlls/wineios.drv/ios-app/build/Wine.ipa

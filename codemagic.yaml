workflows:
  ios-build:
    name: Wine iOS Build
    max_build_duration: 60
    environment:
      vars:
        MIN_IOS_VERSION: "13.0"
        APP_DIR: "/Users/builder/clone"
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Setup
        script: |
          set -e
          cd $APP_DIR
          rm -rf dlls/wineios.drv/ios-app/build
          mkdir -p dlls/wineios.drv/ios-app/build/objects
          mkdir -p dlls/wineios.drv/ios-app/build/Wine.app
      - name: Compile wineios
        script: |
          set -e
          cd $APP_DIR
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for src in dlls/wineios.drv/wineios/*.c; do
            NAME=$(basename "$src" .c)
            clang -target arm64-apple-ios -isysroot "$SDK" -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -c "$src" -o "dlls/wineios.drv/ios-app/build/objects/${NAME}.o" 2>/dev/null || true
          done
          ar rcs dlls/wineios.drv/ios-app/build/libwineios.a dlls/wineios.drv/ios-app/build/objects/*.o
      - name: Compile app
        script: |
          set -e
          cd $APP_DIR
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for src in dlls/wineios.drv/ios-app/*.m; do
            NAME=$(basename "$src" .m)
            clang -target arm64-apple-ios -isysroot "$SDK" -miphoneos-version-min=$MIN_IOS_VERSION -fobjc-arc -c "$src" -o "dlls/wineios.drv/ios-app/build/objects/${NAME}.o" 2>/dev/null || true
          done
          ar rcs dlls/wineios.drv/ios-app/build/libwineapp.a dlls/wineios.drv/ios-app/build/objects/*.o
      - name: Link
        script: |
          set -e
          cd $APP_DIR
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios -isysroot "$SDK" -miphoneos-version-min=$MIN_IOS_VERSION -fobjc-arc -fobjc-link-runtime -ObjC -lc++ -lz -o dlls/wineios.drv/ios-app/build/Wine.app/Wine dlls/wineios.drv/ios-app/build/objects/*.o -Ldlls/wineios.drv/ios-app/build -lwineios 2>&1 | head -20
          ls -la dlls/wineios.drv/ios-app/build/Wine.app/Wine 2>/dev/null || echo "Link may have failed"
      - name: Create IPA
        script: |
          set -e
          cd $APP_DIR/dlls/wineios.drv/ios-app/build
          mkdir -p Payload/Wine.app/wine/drive_c
          cp Wine.app/Wine Payload/Wine.app/
          printf "[wine]\nVersion=8.0\n" > Payload/Wine.app/wine/config
          printf "APPL????" > Payload/Wine.app/PkgInfo
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>Wine</string><key>CFBundleIdentifier</key><string>com.wine.ios.app</string><key>CFBundleName</key><string>Wine</string><key>CFBundleDisplayName</key><string>Wine iOS</string><key>CFBundleShortVersionString</key><string>8.0</string><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>13.0</string></dict></plist>' > Payload/Wine.app/Info.plist
          zip -r Wine.ipa Payload
          ls -la Wine.ipa
    artifacts:
      - dlls/wineios.drv/ios-app/build/Wine.ipa

# Workflow Definition
workflows:
  # iOS Build Workflow for Mac Mini M2
  ios-build:
    name: Wine iOS Build (Mac Mini M2)
    max_build_duration: 120
    
    # Use Mac Mini M2 for ARM64 native compilation
    machine:
      type: mac_mini_m2
      xcode: latest
      
    # Environment variables
    environment:
      vars:
        # iOS SDK minimum version
        MIN_IOS_VERSION: "13.0"
        
        # Code signing (set in Codemagic UI for production)
        APP_ID: ""
        CERTIFICATE: ""
        APP_STORE_CONNECT_KEY: ""
        
        # Xcode configuration
        Xcode_version: latest
        DEVELOPMENT_TEAM: ""
        
      flutter: stable
      cocoapods: default
      
    # Trigger configuration
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "*"
          include: false
    
    # Build phases
    scripts:
      # Step 1: Verify environment
      - name: Verify Xcode installation
        script: |
          echo "=== Verifying Xcode ==="
          xcode-select --print-path
          xcodebuild -version
          xcodebuild -showsdks
      
      # Step 2: Clone iOS SDK if needed (theos sdks)
      - name: Setup iOS SDK
        script: |
          echo "=== Setting up iOS SDK ==="
          if [ ! -d "ios-sdk" ]; then
            git clone https://github.com/theos/sdks.git ios-sdk
          fi
          ls -la ios-sdk/
      
      # Step 3: Navigate to iOS app directory
      - name: Navigate to iOS app
        script: |
          echo "=== Navigating to iOS app ==="
          cd dlls/wineios.drv/ios-app/
          ls -la
      
      # Step 4: Clean previous builds
      - name: Clean build artifacts
        script: |
          echo "=== Cleaning previous builds ==="
          cd dlls/wineios.drv/ios-app/
          rm -rf build/
          rm -rf DerivedData/
          rm -f *.o
          make clean || true
      
      # Step 5: Build using Xcode
      - name: Build iOS Project
        script: |
          echo "=== Building iOS Project ==="
          cd dlls/wineios.drv/ios-app/
          
          # Use xcodebuild to build
          xcodebuild -project project.pbxproj \
            -scheme Wine \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -arch arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=$MIN_IOS_VERSION \
            ENABLE_BITCODE=NO \
            build 2>&1 | tee build.log
      
      # Step 6: Create Payload directory and copy app
      - name: Prepare IPA contents
        script: |
          echo "=== Preparing IPA contents ==="
          cd dlls/wineios.drv/ios-app/
          
          # Find the built app
          APP_PATH=$(find build -name "Wine.app" -type d 2>/dev/null | head -1)
          
          # If not found in build/, try DerivedData
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Wine.app" -type d 2>/dev/null | head -1)
          fi
          
          echo "Found app at: $APP_PATH"
          
          if [ -d "$APP_PATH" ]; then
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            echo "App copied to Payload directory"
          else
            echo "WARNING: App not found, creating placeholder structure"
            mkdir -p build/Payload/Wine.app
            touch build/Payload/Wine.app/Placeholder.txt
          fi
      
      # Step 7: Copy required files to Payload
      - name: Copy resources to Payload
        script: |
          echo "=== Copying resources ==="
          cd dlls/wineios.drv/ios-app/
          
          # Copy Info.plist and other resources
          cp -f Info.plist build/Payload/Wine.app/ 2>/dev/null || true
          cp -f Wine.entitlements build/Payload/Wine.app/ 2>/dev/null || true
          cp -f LaunchScreen.storyboard build/Payload/Wine.app/ 2>/dev/null || true
          
          ls -laR build/Payload/
      
      # Step 8: Create IPA using zip
      - name: Create IPA package
        script: |
          echo "=== Creating IPA package ==="
          cd dlls/wineios.drv/ios-app/build/
          
          # Remove old IPA if exists
          rm -f Wine.ipa
          
          # Create IPA (must be uncompressed or use proper tool)
          zip -r -q Wine.ipa Payload/
          
          echo "IPA created successfully"
          ls -la Wine.ipa
      
      # Step 9: Verify IPA
      - name: Verify IPA package
        script: |
          echo "=== Verifying IPA ==="
          cd dlls/wineios.drv/ios-app/build/
          
          if [ -f "Wine.ipa" ]; then
            echo "IPA file exists"
            ls -la Wine.ipa
            
            # Check if it's a valid zip
            file Wine.ipa
            unzip -l Wine.ipa | head -20
          else
            echo "ERROR: IPA file was not created"
            exit 1
          fi

    # Artifacts configuration
    artifacts:
      - dlls/wineios.drv/ios-app/build/Wine.ipa
      - dlls/wineios.drv/ios-app/build/*.log
      - dlls/wineios.drv/ios-app/build/Payload/
    
    # Publishing configuration (optional)
    # Uncomment and configure for your needs:
    # publishing:
    #   email:
    #     recipients:
    #       - your-email@example.com
    #     notify:
    #       success: true
    #       failure: true
    #   app_store_connect:
    #     api_key: $APP_STORE_CONNECT_KEY
    #     api_key_id: $APP_STORE_API_KEY_ID
    #     api_issuer: $APP_STORE_API_ISSUER
    #     submit_to_testflight: false

# ============================================
# Alternative: Using Makefile (Linux-style build)
# ============================================
workflows:
  ios-build-makefile:
    name: Wine iOS Build (Makefile)
    max_build_duration: 120
    
    machine:
      type: mac_mini_m2
      xcode: latest
      
    environment:
      vars:
        MIN_IOS_VERSION: "13.0"
        SDK_PATH: ""
      flutter: stable
      cocoapods: default
      
    scripts:
      - name: Setup SDK
        script: |
          echo "=== Setting up SDK ==="
          if [ ! -d "ios-sdk" ]; then
            git clone https://github.com/theos/sdks.git ios-sdk
          fi
      
      - name: Build with Makefile
        script: |
          echo "=== Building with Makefile ==="
          cd dlls/wineios.drv/ios-app/
          make clean && make SDK_PATH=/Users/builder/clone/ios-sdk
          
      - name: Create IPA
        script: |
          echo "=== Creating IPA ==="
          cd dlls/wineios.drv/ios-app/
          make ipa-structure || true
          
          # Create IPA if possible
          cd build/
          if [ -d "Payload/Wine.app" ]; then
            rm -f Wine.ipa
            zip -r -q Wine.ipa Payload/
            ls -la Wine.ipa
          fi
      
    artifacts:
      - dlls/wineios.drv/ios-app/build/Wine.ipa

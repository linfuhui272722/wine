# Codemagic CI/CD Configuration for Wine iOS
#
# Builds Wine iOS application and generates IPA for jailbroken devices
# See README in dlls/wineios.drv/ios-app/ for more details.
#

workflows:
  ios-build:
    name: Wine iOS Build
    max_build_duration: 120
    
    environment:
      vars:
        MIN_IOS_VERSION: "13.0"
        APP_BUNDLE_ID: "com.wine.ios.app"
        APP_DIR: "/Users/builder/clone"
      flutter: stable
      xcode: latest
      cocoapods: default
      
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    
    scripts:
      # Step 1: Verify environment
      - name: Verify environment
        script: |
          echo "=== Environment ==="
          echo "Xcode version:"
          xcodebuild -version
          xcode-select --print-path
          echo ""
          echo "Available simulators:"
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -5
      
      # Step 2: Setup and verify project
      - name: Verify project structure
        script: |
          echo "=== Project Structure ==="
          cd $APP_DIR
          ls -la dlls/wineios.drv/
          ls -la dlls/wineios.drv/ios-app/
          ls -la dlls/wineios.drv/ios-app/Wine.xcodeproj/
      
      # Step 3: Build Wine iOS core library
      - name: Build Wine iOS Core
        script: |
          echo "=== Building Wine iOS Core ==="
          cd $APP_DIR/dlls/wineios.drv/wineios
          
          # Clean previous builds
          make clean 2>/dev/null || true
          
          # Build using makefile (uses system Xcode toolchain)
          make ios
          
          echo "=== Core library built ==="
          ls -la *.a *.o 2>/dev/null || ls -la *.o
      
      # Step 4: Copy core library to ios-app
      - name: Prepare libraries
        script: |
          echo "=== Preparing Libraries ==="
          cd $APP_DIR/dlls/wineios.drv/ios-app
          
          # Copy the static library
          cp ../wineios/libwineios.a .
          
          # List ObjC source files
          ls -la *.m *.h
      
      # Step 5: Clean build directory
      - name: Clean build artifacts
        script: |
          echo "=== Clean ==="
          cd $APP_DIR/dlls/wineios.drv/ios-app
          rm -rf build
          mkdir -p build
          rm -rf ~/Library/Developer/Xcode/DerivedData/Wine-* 2>/dev/null || true
      
      # Step 6: Build iOS Project with xcodebuild
      - name: Build iOS Project
        script: |
          echo "=== Building iOS Project ==="
          
          cd $APP_DIR/dlls/wineios.drv/ios-app
          
          # Verify Xcode project exists
          if [ ! -d "Wine.xcodeproj" ]; then
            echo "ERROR: Wine.xcodeproj not found!"
            ls -la
            exit 1
          fi
          
          echo "Building Wine.xcodeproj..."
          
          # Build using xcodebuild with correct paths
          xcodebuild -project Wine.xcodeproj \
            -scheme Wine \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=$MIN_IOS_VERSION \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            BUILD_LIBRARY_FOR_DISTRIBUTING=NO \
            OTHER_CFLAGS="-isysroot $(xcrun --sdk iphoneos --show-sdk-path)" \
            2>&1 | tee build.log
          
          BUILD_RESULT=${PIPESTATUS[0]}
          
          if [ $BUILD_RESULT -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -i "error:" build.log || tail -50 build.log
            exit 1
          fi
          
          echo "=== Build Completed ==="
      
      # Step 7: Find the built app bundle
      - name: Locate built app
        script: |
          echo "=== Locating App ==="
          
          # Find Wine.app in DerivedData
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Wine.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Wine.app not found in DerivedData!"
            echo "Searching alternative locations..."
            find ~ -name "Wine.app" -type d 2>/dev/null | head -3
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          echo "App contents:"
          ls -la "$APP_PATH/"
          
          # Check executable exists
          if [ -f "$APP_PATH/Wine" ]; then
            echo "Wine executable: $(ls -la $APP_PATH/Wine)"
          fi
          
          # Save path for next step
          echo "$APP_PATH" > /tmp/wine_app_path.txt
      
      # Step 8: Create IPA structure
      - name: Create IPA package
        script: |
          echo "=== Creating IPA ==="
          
          APP_PATH=$(cat /tmp/wine_app_path.txt)
          BUILD_DIR=$APP_DIR/dlls/wineios.drv/ios-app/build
          
          mkdir -p $BUILD_DIR/Payload
          rm -rf $BUILD_DIR/Payload/Wine.app
          
          # Copy the app bundle
          cp -R "$APP_PATH" $BUILD_DIR/Payload/
          
          echo "=== Payload Contents ==="
          ls -la $BUILD_DIR/Payload/Wine.app/
          
          # Verify executable is included
          if [ -f "$BUILD_DIR/Payload/Wine.app/Wine" ]; then
            echo "Executable included: $(ls -la $BUILD_DIR/Payload/Wine.app/Wine)"
          else
            echo "WARNING: Wine executable not found in Payload!"
            ls -la $BUILD_DIR/Payload/Wine.app/
          fi
          
          # Create IPA using zip
          cd $BUILD_DIR
          rm -f Wine.ipa
          zip -r Wine.ipa Payload/
          
          echo "=== IPA Created ==="
          ls -la Wine.ipa
          
          # Verify IPA contents
          echo "=== IPA Contents (first 20 files) ==="
          unzip -l Wine.ipa | head -25
      
      # Step 9: Verify final IPA
      - name: Verify IPA
        script: |
          echo "=== Verifying IPA ==="
          
          BUILD_DIR=$APP_DIR/dlls/wineios.drv/ios-app/build
          
          if [ -f "$BUILD_DIR/Wine.ipa" ]; then
            IPA_SIZE=$(ls -lh $BUILD_DIR/Wine.ipa | awk '{print $5}')
            echo "IPA file: $BUILD_DIR/Wine.ipa ($IPA_SIZE)"
            
            # Verify it's a valid zip
            file $BUILD_DIR/Wine.ipa
            
            # Check for executable inside
            if unzip -l $BUILD_DIR/Wine.ipa | grep -q "Wine.app/Wine"; then
              echo "✓ Wine executable found in IPA"
            else
              echo "⚠ Warning: Wine executable may not be in IPA"
            fi
            
            echo "=== IPA Ready for Distribution ==="
          else
            echo "ERROR: IPA not created!"
            exit 1
          fi

    artifacts:
      - build/Wine.ipa
      - build.log

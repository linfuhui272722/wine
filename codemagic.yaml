workflows:
  ios-build:
    name: Wine iOS Build
    max_build_duration: 60
    environment:
      vars:
        MIN_IOS_VERSION: "13.0"
        APP_DIR: "/Users/builder/clone"
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Verify environment
        script: |
          set -e
          xcodebuild -version
      - name: Verify project
        script: |
          set -e
          cd $APP_DIR
          ls dlls/wineios.drv/ios-app/Wine.xcodeproj/
      - name: Setup
        script: |
          set -e
          cd $APP_DIR
          rm -rf dlls/wineios.drv/ios-app/build
          mkdir -p dlls/wineios.drv/ios-app/build
          rm -rf ~/Library/Developer/Xcode/DerivedData/Wine-*
      - name: Compile Wine iOS Core
        script: |
          set -e
          cd $APP_DIR
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CFLAGS="-target arm64-apple-ios -isysroot $SDK -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -fno-common -Wall -O2"
          mkdir -p dlls/wineios.drv/ios-app/build/objects/wineios
          for src in dlls/wineios.drv/wineios/*.c; do
            if [ -f "$src" ]; then
              NAME=$(basename "$src" .c)
              clang $CFLAGS -Idlls/wineios.drv/wineios -c "$src" -o "dlls/wineios.drv/ios-app/build/objects/wineios/${NAME}.o" 2>/dev/null || true
            fi
          done
          ar rcs dlls/wineios.drv/ios-app/build/libwineios.a dlls/wineios.drv/ios-app/build/objects/wineios/*.o 2>/dev/null || true
      - name: Compile iOS App
        script: |
          set -e
          cd $APP_DIR
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CFLAGS="-target arm64-apple-ios -isysroot $SDK -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -fno-common -Wall -O2 -fobjc-arc"
          mkdir -p dlls/wineios.drv/ios-app/build/objects/app
          for src in dlls/wineios.drv/ios-app/*.m; do
            if [ -f "$src" ]; then
              NAME=$(basename "$src" .m)
              clang $CFLAGS -Idlls/wineios.drv/ios-app -Idlls/wineios.drv/wineios -c "$src" -o "dlls/wineios.drv/ios-app/build/objects/app/${NAME}.o" 2>/dev/null || true
            fi
          done
          ar rcs dlls/wineios.drv/ios-app/build/libwineapp.a dlls/wineios.drv/ios-app/build/objects/app/*.o 2>/dev/null || true
      - name: Copy libraries
        script: |
          set -e
          cd $APP_DIR
          cp dlls/wineios.drv/ios-app/build/libwineios.a dlls/wineios.drv/ios-app/
          cp dlls/wineios.drv/ios-app/build/libwineapp.a dlls/wineios.drv/ios-app/
      - name: Build
        script: |
          set -e
          cd $APP_DIR/dlls/wineios.drv/ios-app
          xcodebuild -project Wine.xcodeproj -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=$MIN_IOS_VERSION ARCHS=arm64 2>&1 | tail -30
      - name: Find app
        script: |
          set -e
          cd $APP_DIR
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Wine.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "App not found"
            exit 1
          fi
          echo "Found: $APP_PATH"
          cp -R "$APP_PATH" dlls/wineios.drv/ios-app/build/Wine.app
          ls dlls/wineios.drv/ios-app/build/Wine.app/
      - name: Create IPA
        script: |
          set -e
          cd $APP_DIR/dlls/wineios.drv/ios-app/build
          mkdir -p Payload
          cp -R Wine.app Payload/
          mkdir -p Payload/Wine.app/wine/drive_c
          printf "[wine]\nVersion=8.0\n" > Payload/Wine.app/wine/config
          printf "APPL????" > Payload/Wine.app/PkgInfo
          rm -rf Payload/Wine.app/_CodeSignature
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>Wine</string><key>CFBundleIdentifier</key><string>com.wine.ios.app</string><key>CFBundleName</key><string>Wine</string><key>CFBundleDisplayName</key><string>Wine iOS</string><key>CFBundleShortVersionString</key><string>8.0</string><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>13.0</string></dict></plist>' > Payload/Wine.app/Info.plist
          zip -r Wine.ipa Payload
          ls -la Wine.ipa
    artifacts:
      - dlls/wineios.drv/ios-app/build/Wine.ipa

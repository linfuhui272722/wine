workflows:
  ios-build:
    name: Wine iOS Build
    max_build_duration: 60
    environment:
      vars:
        MIN_IOS_VERSION: "13.0"
        APP_DIR: "/Users/builder/clone"
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
        - pattern: main
          include: true
    scripts:
      - name: Verify environment
        script: |
          set -e
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos
      - name: Verify project
        script: |
          set -e
          cd $APP_DIR/dlls/wineios.drv/ios-app
          ls -la Wine.xcodeproj/
      - name: Setup
        script: |
          set -e
          cd $APP_DIR
          rm -rf dlls/wineios.drv/ios-app/build
          mkdir -p dlls/wineios.drv/ios-app/build
          rm -rf ~/Library/Developer/Xcode/DerivedData/Wine-*
      - name: Compile wineios on macOS
        script: |
          set -e
          cd $APP_DIR
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p dlls/wineios.drv/ios-app/build/wineios
          clang -target arm64-apple-ios -isysroot "$SDK" -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -c dlls/wineios.drv/wineios/wineios.c -o dlls/wineios.drv/ios-app/build/wineios/wineios.o 2>&1 | grep -v warning || true
          clang -target arm64-apple-ios -isysroot "$SDK" -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -c dlls/wineios.drv/wineios/ios_syscalls.c -o dlls/wineios.drv/ios-app/build/wineios/ios_syscalls.o 2>&1 | grep -v warning || true
          clang -target arm64-apple-ios -isysroot "$SDK" -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -c dlls/wineios.drv/wineios/ios_graphics.c -o dlls/wineios.drv/ios-app/build/wineios/ios_graphics.o 2>&1 | grep -v warning || true
          clang -target arm64-apple-ios -isysroot "$SDK" -miphoneos-version-min=$MIN_IOS_VERSION -fPIC -c dlls/wineios.drv/wineios/ios_pe.c -o dlls/wineios.drv/ios-app/build/wineios/ios_pe.o 2>&1 | grep -v warning || true
          ar rcs dlls/wineios.drv/ios-app/build/wineios/libwineios.a dlls/wineios.drv/ios-app/build/wineios/*.o
          ls -la dlls/wineios.drv/ios-app/build/wineios/
      - name: Copy wineios lib
        script: |
          set -e
          cd $APP_DIR
          cp dlls/wineios.drv/ios-app/build/wineios/libwineios.a dlls/wineios.drv/ios-app/
      - name: Build with xcodebuild
        script: |
          set -e
          cd $APP_DIR/dlls/wineios.drv/ios-app
          xcodebuild -project Wine.xcodeproj -scheme Wine -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=$MIN_IOS_VERSION ARCHS=arm64 2>&1 | tee build.log
          tail -30 build.log
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED"
            exit 1
          fi
      - name: Find app
        script: |
          set -e
          cd $APP_DIR
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Wine.app" -type d 2>/dev/null | head -1)
          echo "Found: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "App not found"
            exit 1
          fi
          cp -R "$APP_PATH" dlls/wineios.drv/ios-app/build/Wine.app
          ls dlls/wineios.drv/ios-app/build/Wine.app/
      - name: Create IPA
        script: |
          set -e
          cd $APP_DIR/dlls/wineios.drv/ios-app/build
          mkdir -p Payload
          rm -rf Payload/Wine.app
          cp -R Wine.app Payload/
          mkdir -p Payload/Wine.app/wine/drive_c
          printf "[wine]\nVersion=8.0\n" > Payload/Wine.app/wine/config
          printf "APPL????" > Payload/Wine.app/PkgInfo
          rm -rf Payload/Wine.app/_CodeSignature
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>Wine</string><key>CFBundleIdentifier</key><string>com.wine.ios.app</string><key>CFBundleName</key><string>Wine</string><key>CFBundleDisplayName</key><string>Wine iOS</string><key>CFBundleShortVersionString</key><string>8.0</string><key>CFBundleVersion</key><string>1</string><key>MinimumOSVersion</key><string>13.0</string></dict></plist>' > Payload/Wine.app/Info.plist
          zip -r Wine.ipa Payload
          ls -la Wine.ipa
    artifacts:
      - dlls/wineios.drv/ios-app/build/Wine.ipa
